name: Backend CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-images:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The `secrets` context is NOT available in `if:` expressions (that was the
      # "Unrecognized named-value: 'secrets'" error). Copy it into `env`, which is.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        module: [ ticketing-api, registration-worker, notification-service ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in (and later push) when the Docker Hub secrets are configured;
      # without them the images are still built, which validates the Dockerfile.
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          build-args: MODULE=${{ matrix.module }}
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/ticketing-${{ matrix.module }}:latest
            ${{ env.DOCKERHUB_USERNAME || 'local' }}/ticketing-${{ matrix.module }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max
