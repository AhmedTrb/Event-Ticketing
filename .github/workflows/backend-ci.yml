name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

# A new push to the same branch/PR cancels the previous, now useless, run
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write        # lets the report action publish a check run
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Reactor build from backend/pom.xml: shared -> ticketing-api, worker, notification.
      # `verify` runs every module's tests and writes the JaCoCo report.
      - name: Build and test all modules
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Publish unit test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        continue-on-error: true      # read-only token on fork PRs
        with:
          report_paths: 'backend/**/target/surefire-reports/TEST-*.xml'
          check_name: Unit test report

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Line coverage (JaCoCo)"
            echo "| Module | Covered / total lines | % |"
            echo "|---|---:|---:|"
            for csv in backend/*/target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              module=$(basename "$(dirname "$(dirname "$(dirname "$csv")")")")
              awk -F, -v m="$module" 'NR>1 {missed+=$8; covered+=$9}
                END {t=missed+covered; printf "| %s | %d / %d | %.1f%% |\n", m, covered, t, (t? 100*covered/t : 0)}' "$csv"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-coverage-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/site/jacoco
          retention-days: 14

  e2e-tests:
    name: End-to-end tests (docker compose)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Builds the three images, starts postgres/redis/rabbitmq/keycloak + the apps,
      # bootstraps Keycloak, then runs backend/tests/e2e.
      - name: Run end-to-end suite
        env:
          LOAD_REQUESTS: '300'     # smaller burst than local default: shared runner
          LOAD_P95_MS: '10000'     # generous: a freshly started stack on a shared runner is cold
          E2E_JUNIT_FILE: ${{ github.workspace }}/e2e-junit.xml
        run: bash backend/tests/run-e2e.sh

      - name: Publish end-to-end report
        if: always()
        uses: mikepenz/action-junit-report@v4
        continue-on-error: true
        with:
          report_paths: 'e2e-junit.xml'
          check_name: End-to-end report

      - name: Collect container logs
        if: failure()
        run: docker compose -f backend/infrastructure/docker/docker-compose.yml logs --no-color --tail=500 > compose-logs.txt || true

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            e2e-junit.xml
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f backend/infrastructure/docker/docker-compose.yml down -v || true
