spring:
  application:
    name: registration-worker
  profiles:
    active: dev

server:
  port: 8091

# RabbitMQ Configuration Constants (must match ticketing-api)
messaging:
  rabbitmq:
    registration-queue: registration-queue
    registration-exchange: registration-exchange
    registration-routing-key: registration-routing-key
  registration:
    queue: registration.queue
    exchange: registration.exchange
    routing-key: registration.routingKey
